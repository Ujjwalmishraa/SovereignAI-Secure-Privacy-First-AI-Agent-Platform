services:
  # Secure isolated execution environment for AI-generated code.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    network_mode: "none"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - sandbox_jobs:/jobs
    restart: unless-stopped

  # Local LLM backend.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - severance_internal
    restart: unless-stopped

  # SovereignAI API.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - ollama
      - sandbox
    environment:
      OLLAMA_API_BASE: "http://ollama:11434"
      AGENT_BACKEND: "ollama"
      SEVERANCE_DB_PATH: "/data/severance.db"
      SANDBOX_JOBS_DIR: "/jobs"
    volumes:
      - severance_data:/data
      - ./corpus:/app/corpus:ro
      - sandbox_jobs:/jobs
    ports:
      - "8080:8080"
    networks:
      - severance_internal
    restart: unless-stopped

  # Network monitor sharing the API network namespace.
  network-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "ops/network_monitor.py", "--interval", "1"]
    network_mode: "service:api"
    volumes:
      - ./:/app
    depends_on:
      - api
    restart: unless-stopped

networks:
  severance_internal:
    driver: bridge
    internal: true

volumes:
  ollama_models:
  severance_data:
  sandbox_jobs:
